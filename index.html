<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Inconscient Tactique</title>

<!-- Liaisons PWA -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">

<style>
    :root {
        --bg-void: #070d0b;
        --bg-base: #0c1412;
        --bg-panel: #111d19;
        --bg-card: #162420;
        --bg-card-hover: #1c2e29;
        --bg-input: #1a2a25;
        --border-subtle: rgba(255, 255, 255, 0.07);
        --border-medium: rgba(255, 255, 255, 0.14);
        
        --text-primary: #f0f7f5;
        --text-secondary: #8ea8a0;
        --text-tertiary: #526b64;

        --accent-emerald: #00e676;
        --accent-emerald-glow: rgba(0, 230, 118, 0.28);
        --accent-cyan: #00e5ff;
        --accent-amber: #ffab40;
        --accent-crimson: #ff3d71;
        --accent-crimson-glow: rgba(255, 61, 113, 0.28);
        --accent-purple: #b388ff;

        --q1-color: #ff3d71; /* Faire */
        --q2-color: #00e5ff; /* Planifier */
        --q3-color: #ffab40; /* Déléguer */
        --q4-color: #90a4ae; /* Éliminer */
        
        --heat-0: #12211c;
        --heat-1: #0b452e;
        --heat-2: #056a3f;
        --heat-3: #009d57;
        --heat-4: #00e676;

        --heat-neg-0: #12211c;
        --heat-neg-1: #3b2814;
        --heat-neg-2: #613612;
        --heat-neg-3: #942525;
        --heat-neg-4: #ff3d71;

        --radius-sm: 8px;
        --radius-md: 14px;
        --radius-lg: 22px;
    }

    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
    }

    body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
        background-color: var(--bg-void);
        background-image: 
            radial-gradient(at 0% 0%, rgba(0, 229, 255, 0.05) 0px, transparent 50%),
            radial-gradient(at 100% 0%, rgba(0, 230, 118, 0.07) 0px, transparent 60%),
            radial-gradient(at 50% 100%, rgba(179, 136, 255, 0.04) 0px, transparent 60%);
        color: var(--text-primary);
        height: 100dvh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    /* HEADER */
    .app-header {
        padding: 12px 16px 8px 16px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
        background: rgba(7, 13, 11, 0.88);
        backdrop-filter: blur(16px);
        border-bottom: 1px solid var(--border-subtle);
        z-index: 20;
    }

    .header-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .brand-group {
        display: flex;
        flex-direction: column;
    }

    .brand-subtitle {
        font-size: 0.65rem;
        letter-spacing: 2.5px;
        text-transform: uppercase;
        color: var(--accent-emerald);
        font-weight: 800;
    }

    .brand-title {
        font-size: 1.45rem;
        font-weight: 900;
        letter-spacing: 0.5px;
        margin: 2px 0 0 0;
        color: #fff;
        text-transform: uppercase;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .score-badge {
        font-size: 0.65rem;
        padding: 2px 8px;
        border-radius: 12px;
        background: var(--bg-card);
        border: 1px solid var(--border-medium);
        color: var(--text-secondary);
        font-weight: 800;
    }

    .header-actions {
        display: flex;
        gap: 8px;
        align-items: center;
    }

    .btn-icon {
        background: var(--bg-panel);
        border: 1px solid var(--border-subtle);
        color: var(--text-secondary);
        width: 36px;
        height: 36px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 1rem;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-icon:active { transform: scale(0.92); }
    .btn-icon.active {
        color: var(--accent-emerald);
        border-color: var(--accent-emerald);
        background: rgba(0, 230, 118, 0.12);
        box-shadow: 0 0 10px var(--accent-emerald-glow);
    }

    /* SEARCH BAR */
    .search-wrapper {
        display: none;
        padding: 2px 0 6px 0;
    }
    .search-wrapper.open { display: block; }
    .search-input {
        width: 100%;
        background: var(--bg-input);
        border: 1px solid var(--accent-emerald);
        border-radius: 10px;
        padding: 9px 12px;
        color: var(--text-primary);
        font-size: 0.88rem;
        outline: none;
    }

    /* HORIZONTAL CATEGORY SCROLLER */
    .cat-bar {
        display: flex;
        gap: 7px;
        overflow-x: auto;
        padding-bottom: 2px;
        scrollbar-width: none;
    }
    .cat-bar::-webkit-scrollbar { display: none; }

    .cat-pill {
        padding: 6px 13px;
        border-radius: 20px;
        font-size: 0.72rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        background: var(--bg-panel);
        color: var(--text-secondary);
        border: 1px solid var(--border-subtle);
        white-space: nowrap;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        transition: all 0.2s;
    }

    .cat-pill.active {
        background: var(--accent-emerald);
        color: #04120a;
        border-color: var(--accent-emerald);
        box-shadow: 0 0 12px var(--accent-emerald-glow);
    }

    .cat-pill.add-cat {
        border-style: dashed;
        color: var(--accent-emerald);
    }

    /* MAIN CONTAINER & TABS */
    .view-container {
        flex: 1;
        overflow: hidden;
        position: relative;
    }

    .tab-view {
        display: none;
        height: 100%;
        overflow-y: auto;
        padding: 10px 12px 90px 12px;
        flex-direction: column;
        gap: 14px;
        scrollbar-width: none;
    }
    .tab-view::-webkit-scrollbar { display: none; }
    .tab-view.active { display: flex; }

    /* ONGLET HABITUDES SPÉCIFIQUE (IMMERSION PLEIN ÉCRAN) */
    #tab-routine {
        padding: 10px 0 80px 0;
        overflow: hidden;
        display: none;
        flex-direction: column;
        gap: 8px;
    }
    #tab-routine.active { display: flex; }

    /* MACRO HEATMAP CONTAINER (ISO 8601) */
    .macro-heat-section {
        padding: 0 14px;
        flex-shrink: 0;
    }

    .macro-heat-card {
        background: var(--bg-panel);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-md);
        padding: 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .macro-heat-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .macro-heat-title {
        font-size: 0.82rem;
        font-weight: 800;
        letter-spacing: 0.8px;
        text-transform: uppercase;
        color: var(--text-primary);
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .scope-toggle-group {
        display: flex;
        background: var(--bg-card);
        border: 1px solid var(--border-subtle);
        border-radius: 12px;
        padding: 2px;
    }

    .scope-btn {
        background: transparent;
        border: none;
        color: var(--text-tertiary);
        font-size: 0.65rem;
        font-weight: 800;
        padding: 3px 8px;
        border-radius: 9px;
        cursor: pointer;
        transition: all 0.2s;
    }
    .scope-btn.active {
        background: var(--accent-emerald);
        color: #031208;
    }

    /* GRILLE STRICTE ISO 8601 : 7 LIGNES STRICTES (LUN -> DIM) */
    .iso-heat-wrapper {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .iso-day-labels {
        display: grid;
        grid-template-rows: repeat(7, 12px);
        gap: 3px;
        font-size: 0.58rem;
        font-weight: 800;
        color: var(--text-tertiary);
        line-height: 12px;
        text-align: right;
        padding-right: 2px;
    }

    .iso-grid {
        display: grid;
        grid-template-rows: repeat(7, 12px);
        grid-auto-flow: column;
        grid-auto-columns: 12px;
        gap: 3px;
        overflow-x: auto;
        padding-bottom: 2px;
        scrollbar-width: none;
    }
    .iso-grid::-webkit-scrollbar { display: none; }

    .iso-cell {
        width: 12px;
        height: 12px;
        border-radius: 3px;
        background: var(--heat-0);
        cursor: pointer;
        transition: transform 0.12s;
    }
    .iso-cell:active { transform: scale(1.4); z-index: 5; }
    .iso-cell.ghost {
        background: transparent;
        border: 1px dashed rgba(255, 255, 255, 0.05);
        pointer-events: none;
    }
    .iso-cell.today-ring {
        outline: 1.5px solid #fff;
        outline-offset: 1px;
    }

    /* HEATMAP NIVEAUX POSITIFS */
    .iso-cell.p-0 { background: var(--heat-0); }
    .iso-cell.p-1 { background: var(--heat-1); }
    .iso-cell.p-2 { background: var(--heat-2); }
    .iso-cell.p-3 { background: var(--heat-3); }
    .iso-cell.p-4 { background: var(--heat-4); box-shadow: 0 0 6px var(--accent-emerald-glow); }

    /* HEATMAP NIVEAUX NÉGATIFS */
    .iso-cell.n-0 { background: var(--heat-neg-0); }
    .iso-cell.n-1 { background: var(--heat-neg-1); }
    .iso-cell.n-2 { background: var(--heat-neg-2); }
    .iso-cell.n-3 { background: var(--heat-neg-3); }
    .iso-cell.n-4 { background: var(--heat-neg-4); box-shadow: 0 0 6px var(--accent-crimson-glow); }

    /* CAROUSEL SWIPEABLE PLEIN ÉCRAN */
    .habit-slider-container {
        flex: 1;
        overflow-x: auto;
        overflow-y: hidden;
        display: flex;
        scroll-snap-type: x mandatory;
        -webkit-overflow-scrolling: touch;
        gap: 12px;
        padding: 6px 14px 10px 14px;
        scrollbar-width: none;
    }
    .habit-slider-container::-webkit-scrollbar { display: none; }

    /* Classe injectée dynamiquement pour bloquer le swipe de carte pendant la roulette */
    .habit-slider-container.locked-for-dial {
        overflow-x: hidden !important;
        scroll-snap-type: none !important;
    }

    .habit-full-card {
        flex: 0 0 calc(100vw - 28px);
        scroll-snap-align: center;
        background: var(--bg-card);
        border: 1px solid var(--border-medium);
        border-radius: var(--radius-lg);
        padding: 16px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    .habit-full-card.type-negative {
        border-color: rgba(255, 61, 113, 0.3);
    }

    .habit-card-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
    }

    .habit-card-title-wrap {
        display: flex;
        flex-direction: column;
        gap: 2px;
    }

    .habit-card-title {
        font-size: 1.25rem;
        font-weight: 900;
        letter-spacing: 0.3px;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .habit-card-tag {
        font-size: 0.65rem;
        font-weight: 800;
        text-transform: uppercase;
        color: var(--text-tertiary);
        letter-spacing: 1px;
    }

    .habit-card-actions {
        display: flex;
        gap: 6px;
    }

    .habit-kpi-row {
        display: flex;
        gap: 10px;
        margin-top: 6px;
    }

    .kpi-chip {
        font-size: 0.72rem;
        font-weight: 800;
        padding: 3px 8px;
        border-radius: 8px;
        background: var(--bg-panel);
        border: 1px solid var(--border-subtle);
        color: var(--text-secondary);
        display: flex;
        align-items: center;
        gap: 4px;
    }

    /* MONUMENTAL VALUE READOUT */
    .monument-readout-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin: 6px 0;
    }

    .monument-number {
        font-size: 4.2rem;
        font-weight: 900;
        font-variant-numeric: tabular-nums;
        line-height: 1;
        letter-spacing: -2px;
        color: var(--text-primary);
        text-shadow: 0 0 30px var(--accent-emerald-glow);
        cursor: pointer;
        transition: transform 0.12s, color 0.2s;
    }
    .monument-number:active { transform: scale(1.05); }

    .monument-number.negative-alert {
        color: var(--accent-crimson);
        text-shadow: 0 0 30px var(--accent-crimson-glow);
    }

    .monument-unit {
        font-size: 0.88rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: var(--text-secondary);
        margin-top: 4px;
    }

    /* MINI HEATMAP 4 SEMAINES */
    .card-mini-heat {
        background: rgba(0,0,0,0.25);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-sm);
        padding: 8px 10px;
        display: flex;
        flex-direction: column;
        gap: 6px;
    }
    .card-mini-heat-header {
        display: flex;
        justify-content: space-between;
        font-size: 0.62rem;
        color: var(--text-tertiary);
        font-weight: 800;
        text-transform: uppercase;
    }

    /* CONTRÔLEUR ISOLÉ // TOUCH-ACTION NONE STRICT */
    .dial-controller {
        background: var(--bg-panel);
        border: 1px solid var(--border-medium);
        border-radius: var(--radius-md);
        padding: 8px 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        /* Isolation stricte anti-propagation sur le container */
        touch-action: none !important;
    }

    .dial-track-container {
        position: relative;
        width: 100%;
        height: 52px;
        overflow: hidden;
        cursor: ew-resize;
        background: rgba(0,0,0,0.3);
        border-radius: var(--radius-sm);
        border: 1px solid var(--border-subtle);
        /* Bloque le scroll natif horizontal sur la réglette */
        touch-action: none !important;
    }

    .dial-cursor {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 50%;
        width: 3px;
        background: var(--accent-emerald);
        box-shadow: 0 0 12px var(--accent-emerald-glow);
        transform: translateX(-50%);
        z-index: 3;
        pointer-events: none;
    }
    .dial-cursor.cursor-crimson {
        background: var(--accent-crimson);
        box-shadow: 0 0 12px var(--accent-crimson-glow);
    }

    .dial-tick-ribbon {
        display: flex;
        align-items: center;
        height: 100%;
        position: absolute;
        left: 50%;
        pointer-events: none;
        will-change: transform;
    }

    .dial-tick {
        width: 20px;
        height: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
    }
    .dial-tick::after {
        content: '';
        display: block;
        width: 2px;
        height: 12px;
        background: var(--border-medium);
        border-radius: 1px;
    }
    .dial-tick.major::after {
        height: 24px;
        background: var(--text-primary);
        width: 2.5px;
    }

    .dial-step-controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        touch-action: manipulation;
    }

    .btn-step {
        background: var(--bg-input);
        border: 1px solid var(--border-subtle);
        color: var(--text-primary);
        font-size: 1.1rem;
        font-weight: 900;
        width: 50px;
        height: 38px;
        border-radius: 10px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.1s, background 0.15s;
        touch-action: none !important;
    }
    .btn-step:active {
        transform: scale(0.92);
        background: var(--accent-emerald);
        color: #031208;
    }

    /* PAGINATION BULLETS */
    .slider-dots-row {
        display: flex;
        justify-content: center;
        gap: 6px;
        padding-top: 4px;
        flex-shrink: 0;
    }
    .slider-dot {
        width: 6px;
        height: 6px;
        border-radius: 3px;
        background: var(--border-medium);
        transition: all 0.2s;
    }
    .slider-dot.active {
        width: 18px;
        background: var(--accent-emerald);
    }

    /* 2x2 EISENHOWER GRID */
    .matrix-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        gap: 6px;
        flex: 1;
        min-height: 0;
        margin-bottom: 70px;
    }

    .quadrant {
        background: rgba(18, 29, 25, 0.75);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-md);
        padding: 10px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        backdrop-filter: blur(8px);
        transition: border-color 0.2s;
    }

    .quad-header {
        display: flex;
        flex-direction: column;
        margin-bottom: 8px;
        cursor: pointer;
    }
    #quad-q2 .quad-header, #quad-q4 .quad-header { text-align: right; }

    .quad-title {
        font-size: 0.92rem;
        font-weight: 900;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        letter-spacing: 0.3px;
    }
    #quad-q2 .quad-title, #quad-q4 .quad-title { flex-direction: row-reverse; }

    .quad-sub {
        font-size: 0.65rem;
        font-weight: 600;
        opacity: 0.75;
        margin-top: 1px;
    }

    #quad-q1 .quad-title, #quad-q1 .quad-sub { color: var(--q1-color); }
    #quad-q2 .quad-title, #quad-q2 .quad-sub { color: var(--q2-color); }
    #quad-q3 .quad-title, #quad-q3 .quad-sub { color: var(--q3-color); }
    #quad-q4 .quad-title, #quad-q4 .quad-sub { color: var(--q4-color); }

    .quad-tasks {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding-right: 2px;
        scrollbar-width: none;
    }
    .quad-tasks::-webkit-scrollbar { display: none; }

    /* TASK PILLS */
    .task-pill {
        background: rgba(22, 36, 32, 0.9);
        border: 1px solid var(--border-subtle);
        border-radius: 20px;
        padding: 7px 10px;
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        transition: transform 0.12s, border-color 0.2s, opacity 0.2s;
        min-height: 38px;
    }
    .task-pill:active { transform: scale(0.97); }

    #quad-q1 .task-pill { border-color: rgba(255, 61, 113, 0.45); }
    #quad-q2 .task-pill { border-color: rgba(0, 229, 255, 0.4); }
    #quad-q3 .task-pill { border-color: rgba(255, 171, 64, 0.4); }
    #quad-q4 .task-pill { border-color: rgba(144, 164, 174, 0.3); }

    .task-pill.blocked {
        opacity: 0.45;
        border-style: dashed !important;
    }

    .task-pill.completed {
        opacity: 0.35;
        text-decoration: line-through;
    }

    .radio-circle {
        width: 17px;
        height: 17px;
        border-radius: 50%;
        border: 2px solid currentColor;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.65rem;
        cursor: pointer;
        transition: transform 0.15s;
    }
    .radio-circle:active { transform: scale(1.2); }

    #quad-q1 .radio-circle
