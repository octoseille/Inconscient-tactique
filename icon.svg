<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e231c" />
      <stop offset="100%" stop-color="#070d0b" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fond sombre -->
  <rect width="512" height="512" rx="110" fill="url(#bgGlow)" />

  <!-- Cadre intérieur subtil -->
  <rect x="24" y="24" width="464" height="464" rx="90" fill="none" stroke="#00e676" stroke-width="3" stroke-opacity="0.25" />

  <!-- Réticule & Axe de visée tactique -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#00e676" stroke-width="8" stroke-dasharray="14 10" filter="url(#glow)" />
  <circle cx="256" cy="256" r="70" fill="none" stroke="#00e5ff" stroke-width="6" stroke-opacity="0.8" />

  <!-- Segments cardinaux -->
  <line x1="256" y1="76" x2="256" y2="150" stroke="#00e676" stroke-width="8" stroke-linecap="round" />
  <line x1="256" y1="362" x2="256" y2="436" stroke="#00e676" stroke-width="8" stroke-linecap="round" />
  <line x1="76" y1="256" x2="150" y2="256" stroke="#00e676" stroke-width="8" stroke-linecap="round" />
  <line x1="362" y1="256" x2="436" y2="256" stroke="#00e676" stroke-width="8" stroke-linecap="round" />

  <!-- Cœur tactique -->
  <circle cx="256" cy="256" r="14" fill="#00e676" filter="url(#glow)" />
</svg>
